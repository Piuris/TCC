[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraude-tcc"
version = "1.0.0"
description = "TCC IFRS Canoas — detecção de fraudes em transações financeiras com machine learning"
authors = [{ name = "João Vitor Pires" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
